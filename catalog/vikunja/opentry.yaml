# Vikunja — self-hosted task and project management.
#
# Standard risk: a task tracker with no outbound-request feature. Uses a real
# managed Postgres, so it also demonstrates the two-service shape on the
# standard tier rather than only on elevated apps.
version: 1
app:
  slug: vikunja
  name: Vikunja
  tagline: The to-do app that respects your data
  description: >
    Lists, Kanban boards, Gantt charts, labels, reminders and teams — a
    self-hosted alternative to Todoist and Trello, with a real database
    behind it rather than someone else's cloud.
  homepage: https://vikunja.io
  repo: https://code.vikunja.io/vikunja
  license: AGPL-3.0
  category: productivity
  accent: "#1973ff"
  capabilities:
    outboundHttp: false
    codeExecution: false
  firstSteps:
    - Sign in with the credentials below — the account already exists
    - Open the seeded project and switch it to the Kanban view
    - Everything is stored in the trial's own Postgres and deleted with it
trial:
  ttlMinutes: 30
  entry: { service: app, port: 3456 }
  credentials:
    - label: Username
      key: OPENTRY_ADMIN_USER
      value: demo
    - label: Password
      key: OPENTRY_ADMIN_PASSWORD
      generate: password
infra:
  services:
    - hostname: db
      type: postgresql@16
      mode: NON_HA
      priority: 10
      verticalAutoscaling: { minCpu: 1, maxCpu: 2, minRam: 0.25, maxRam: 1, minDisk: 1, maxDisk: 5 }
    - hostname: app
      type: docker@26.1
      priority: 1
      enableSubdomainAccess: true
      verticalAutoscaling: { cpu: 2, ram: 2, disk: 5 }
      buildFromGit: https://github.com/zeropsio/recipe-docker
      zeropsSetup: app
      zeropsYaml:
        zerops:
          - setup: app
            run:
              base: docker@26.1
              prepareCommands:
                - docker image pull vikunja/vikunja:0.24.4
              ports:
                - port: 3456
                  httpSupport: true
              start: >
                docker run --network=host
                -e VIKUNJA_DATABASE_TYPE -e VIKUNJA_DATABASE_HOST
                -e VIKUNJA_DATABASE_DATABASE -e VIKUNJA_DATABASE_USER
                -e VIKUNJA_DATABASE_PASSWORD -e VIKUNJA_SERVICE_JWTSECRET
                -e VIKUNJA_SERVICE_INTERFACE=:3456
                vikunja/vikunja:0.24.4
      envSecrets:
        VIKUNJA_DATABASE_TYPE: postgres
        VIKUNJA_DATABASE_HOST: db
        VIKUNJA_DATABASE_DATABASE: ${db_dbName}
        VIKUNJA_DATABASE_USER: ${db_user}
        VIKUNJA_DATABASE_PASSWORD: ${db_password}
        VIKUNJA_SERVICE_JWTSECRET: <@generateRandomString(<32>)>
verify:
  - { name: Database reachable, kind: tcp, service: db, port: 5432 }
  - { name: Application responding, kind: http, path: /api/v1/info, timeoutMs: 240000 }
  - { name: Interface renders, kind: http, path: /, expectBodyContains: "Vikunja", timeoutMs: 60000 }

# -----------------------------------------------------------------------------
# Seeding — register the account and leave something on the board.
#
# Vikunja opens on a registration form, then on an empty project list. Neither
# tells a visitor anything about the software. Registering the account they are
# handed, and putting one project with tasks in it, means the first screen is
# the actual product.
# -----------------------------------------------------------------------------
seed:
  - name: Register the demo account
    method: POST
    path: /api/v1/register
    expectStatus: [200, 201]
    body:
      username: ${OPENTRY_ADMIN_USER}
      password: ${OPENTRY_ADMIN_PASSWORD}
      email: demo@opentry.dev

  - name: Sign in
    method: POST
    path: /api/v1/login
    expectStatus: [200]
    body:
      username: ${OPENTRY_ADMIN_USER}
      password: ${OPENTRY_ADMIN_PASSWORD}
    capture:
      token: token

  - name: Create a starter project
    method: PUT
    path: /api/v1/projects
    expectStatus: [200, 201]
    headers:
      authorization: Bearer ${token}
    body:
      title: Try Vikunja
      description: A seeded project so the board is not empty.
    capture:
      projectId: id

  - name: Add a task to it
    method: PUT
    path: /api/v1/projects/${projectId}/tasks
    expectStatus: [200, 201]
    headers:
      authorization: Bearer ${token}
    body:
      title: Drag me to another Kanban column
